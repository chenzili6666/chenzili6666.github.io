baseURL = "https://chenzili6666.github.io/"
locale = "zh-CN"
title = "Chen's Network Notes"
theme = "PaperMod"

enableRobotsTXT = true

[params]
    env = "production"
    title = "Chen's Network Notes"
    description = "记录网络技术、数据中心、自动化以及工程实践中的学习与思考"
    author = "Chen"

    ShowReadingTime = true
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
